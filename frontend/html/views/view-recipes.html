<!-- ==========================================
     VIEW 3: 도마 레시피 목록 (Recipes)
     views/view-recipes.html
     ========================================== -->
<section class="view-section" id="view-recipes">
  <div class="section-tagline">PANTRY TO CUTTING BOARD • 오늘의 냉장고 수확</div>

  <div class="recipes-header-card">
    <div>
      <h1 class="section-main-title" style="margin-bottom: 0.3rem;">도마 위에 펼쳐진 오늘의 추천 레시피</h1>
      <p class="section-description">
        선택하신 냉장고 식재료와 맞춤 요청을 바탕으로, 최상단 1:1 맞춤 레시피 및 유튜브/블로그 인기순 추천을 차려냈습니다.
      </p>
    </div>

    <div class="metrics-pill-box">
      <div class="metric-item">
        <div class="metric-label">추천 레시피</div>
        <div class="metric-value"><span id="recipes-count-val">6</span>건</div>
      </div>
      <div style="width: 1px; background: var(--border-light);"></div>
      <div class="metric-item">
        <div class="metric-label">평균 일치율</div>
        <div class="metric-value"><span id="recipes-avg-match">94.6</span>%</div>
      </div>
    </div>
  </div>

  <!-- 필터 바 -->
  <div class="recipe-filter-bar">
    <div class="selected-ingredients-chips">
      <span style="font-size: 0.74rem; font-weight: 700; color: var(--text-muted); margin-right: 4px;">선택한
        식재료:</span>
      <div id="recipe-selected-chips-container" style="display: flex; gap: 0.35rem; flex-wrap: wrap;"></div>
      <button class="btn-sub-filter" id="btn-edit-ingredients" style="margin-left: 0.5rem;">✏️ 재료 수정</button>
    </div>

    <div class="btn-filter-group" id="recipe-filter-btn-group">
      <button class="btn-sub-filter active" data-match="all">전체보기 (<span id="filter-total-count">6</span>)</button>
      <button class="btn-sub-filter" data-source="youtube">📺 유튜브 인기 (<span id="filter-youtube-count">0</span>)</button>
      <button class="btn-sub-filter" data-source="blog">📝 파워 블로그 (<span id="filter-blog-count">0</span>)</button>
      <button class="btn-sub-filter" data-match="95">일치율 95% 이상</button>
      <button class="btn-sub-filter" id="btn-open-add-recipe-modal"
        style="background: var(--amber-warm); color: #fff; border-color: var(--amber-warm); font-weight: 700;">+ 나만의
        도마 레시피 등록</button>
    </div>
  </div>

  <!-- 레시피 카드 그리드 (최상단 맞춤 레시피 + 하단 유튜브/블로그 조회수순 렌더링) -->
  <div class="recipes-grid" id="recipes-grid-container">
    <!-- 자바스크립트로 동적 렌더링 -->
  </div>

  <!-- 하단 추천 배너 -->
  <div class="recipe-bottom-banner">
    <div class="banner-left">
      <span class="bulb-icon">💡</span>
      <div>
        <div class="banner-title">원하는 레시피가 없으신가요?</div>
        <div class="banner-desc">냉장고 서랍에서 소스류/양념을 1개만 더 선택하시면 14가지 새로운 이색 요리를 추천해드릴 수 있어요.</div>
      </div>
    </div>
    <button class="btn-banner-action" id="btn-banner-more-ingredients">
      냉장고 재료 더 꺼내기
    </button>
  </div>
</section>
